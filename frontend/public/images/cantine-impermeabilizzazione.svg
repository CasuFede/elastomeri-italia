<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
    <defs>
        <pattern id="cantinaGrid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" />
        </pattern>
    </defs>

    <!-- Sfondo solido ad alto contrasto -->
    <rect width="800" height="450" fill="#0f172a" />
    <rect width="800" height="450" fill="url(#cantinaGrid)" />

    <!-- Terreno esterno a sinistra -->
    <path d="M 0 135 L 250 135 L 250 450 L 0 450 Z" fill="#1e293b" />
    <line x1="0" y1="135" x2="250" y2="135" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 5" />

    <!-- Parete perimetrale cantina -->
    <rect x="258" y="135" width="96" height="245" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <!-- Pavimento / Soletta cantina -->
    <rect x="258" y="380" width="500" height="44" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <!-- Soffitto locale cantina -->
    <rect x="258" y="135" width="500" height="32" fill="#334155" stroke="#94a3b8" stroke-width="2" />

    <!-- Membrana impermeabilizzante continua in Poliurea pura (solida, zero glow) -->
    <path d="M 250 135 L 250 388 L 758 388" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 250 135 L 250 388 L 758 388" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Indicatore spinta acqua bloccata esternamente -->
    <g stroke="#38bdf8" stroke-width="3" fill="#38bdf8">
        <line x1="120" y1="220" x2="230" y2="220" />
        <polygon points="240,220 226,212 226,228" />
        <line x1="120" y1="285" x2="230" y2="285" />
        <polygon points="240,285 226,277 226,293" />
    </g>
    <text x="120" y="335" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Acqua e umidità</text>
    <text x="120" y="355" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">BLOCCATE</text>

    <!-- Badge interno cantina asciutta -->
    <g transform="translate(390, 210)">
        <rect width="335" height="120" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2" />
        <text x="20" y="32" fill="#22c55e" font-family="monospace" font-size="13" font-weight="bold">LOCALE INTERNO PROTETTO</text>
        <text x="20" y="66" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="800">Zero Umidità &amp; Muffe</text>
        <text x="20" y="96" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Muri asciutti e aria salubre nel tempo</text>
    </g>

    <!-- Header Card -->
    <g transform="translate(28, 22)">
        <rect width="744" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <rect x="16" y="16" width="10" height="10" rx="2" fill="#38bdf8" />
        <text x="34" y="26" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">CANTINE, BOX E LOCALI INTERRATI</text>
        <text x="16" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="21" font-weight="800">Risanamento e Barriera Totale Contro l'Umidità</text>
        <text x="16" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Sigillatura continua a 90° tra parete e pavimento, resistente alla controspinta</text>
    </g>
</svg>
