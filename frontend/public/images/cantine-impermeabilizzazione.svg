<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
    <defs>
        <pattern id="kGrid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.7" opacity="0.65" />
        </pattern>
        <pattern id="kSoil" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
            <rect width="14" height="14" fill="#ECEAE2" />
            <line x1="0" y1="0" x2="0" y2="14" stroke="#DCD8CC" stroke-width="2" />
        </pattern>
        <pattern id="kConcrete" width="16" height="16" patternUnits="userSpaceOnUse">
            <rect width="16" height="16" fill="#E2E8F0" />
            <circle cx="4" cy="4" r="1" fill="#94A3B8" />
            <circle cx="12" cy="11" r="1" fill="#94A3B8" />
        </pattern>
        <radialGradient id="kBgGlow" cx="62%" cy="54%" r="52%">
            <stop offset="0%" stop-color="#0071E3" stop-opacity="0.055" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>
        <filter id="kShadow" x="-14%" y="-14%" width="128%" height="134%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10" />
        </filter>
    </defs>

    <!-- Sfondo bianco puro + griglia tecnica -->
    <rect width="800" height="500" fill="#FFFFFF" />
    <rect width="800" height="500" fill="url(#kBgGlow)" />
    <rect width="800" height="500" fill="url(#kGrid)" />

    <!-- =================================================================
         SEZIONE ARCHITETTONICA: CANTINE, CORSELLI BOX E LOCALI INTERRATI
         ================================================================= -->
    <g>
        <!-- Terreno esterno umido (sinistra) -->
        <rect x="28" y="160" width="234" height="310" rx="10" fill="url(#kSoil)" />
        <line x1="28" y1="160" x2="262" y2="160" stroke="#334155" stroke-width="2" stroke-linecap="round" />

        <!-- Interno cantina / box auto pulito e asciutto -->
        <rect x="336" y="190" width="420" height="218" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />

        <!-- Dettagli stilizzati interni box/cantina (auto + scaffale leggero) -->
        <g opacity="0.65">
            <!-- Scaffalatura archivio destra -->
            <rect x="652" y="294" width="84" height="106" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.6" />
            <line x1="658" y1="322" x2="730" y2="322" stroke="#CBD5E1" stroke-width="2" />
            <line x1="658" y1="350" x2="730" y2="350" stroke="#CBD5E1" stroke-width="2" />
            <line x1="658" y1="378" x2="730" y2="378" stroke="#CBD5E1" stroke-width="2" />
            <!-- Profilo leggero auto nel corsello/box -->
            <path d="M 382 396 L 392 374 Q 402 362 434 362 L 474 362 Q 496 362 508 376 L 524 380 Q 534 384 534 396 Z" fill="#E2E8F0" />
            <circle cx="412" cy="396" r="11" fill="#CBD5E1" />
            <circle cx="502" cy="396" r="11" fill="#CBD5E1" />
        </g>

        <!-- Parete perimetrale interrata -->
        <rect x="268" y="160" width="68" height="252" fill="url(#kConcrete)" stroke="#64748B" stroke-width="1.8" />
        <!-- Soffitto locale interrato -->
        <rect x="268" y="160" width="496" height="32" fill="#CBD5E1" stroke="#64748B" stroke-width="1.8" />
        <!-- Soletta / pavimento cantina e box -->
        <rect x="268" y="410" width="496" height="48" rx="3" fill="#CBD5E1" stroke="#64748B" stroke-width="1.8" />
        <text x="536" y="439" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.04em">PAVIMENTAZIONE CONTINUA BOX / CANTINA</text>

        <!-- =================================================================
             STRATIGRAFIA IMPERMEABILE: BARRIERA ESTERNA + SGUSCIA 90° INTERNA
             ================================================================= -->
        <!-- Barriera esterna controspinta + continuità sotto-pavimento -->
        <path d="M 263 162 L 263 414 L 760 414" fill="none" stroke="#7DD3FC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 263 162 L 263 414 L 760 414" fill="none" stroke="#0071E3" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Ciclo interno risanante + sguscia continua 90° tra parete e pavimento -->
        <path d="M 340 202 L 340 400 Q 340 406 346 406 L 752 406" fill="none" stroke="#0071E3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Frecce umidità / controspinta bloccate -->
        <g stroke="#0071E3" stroke-width="2.4" fill="none" stroke-linecap="round">
            <line x1="146" y1="248" x2="236" y2="248" />
            <polygon points="248,248 234,241 234,255" fill="#0071E3" stroke="none" />
            <line x1="146" y1="306" x2="236" y2="306" />
            <polygon points="248,306 234,299 234,313" fill="#0071E3" stroke="none" />
            <!-- Linea verticale di blocco -->
            <line x1="252" y1="230" x2="252" y2="328" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="4 3" />
        </g>
    </g>

    <!-- =================================================================
         CALLOUT & BADGE TECNICI (STILE BIANCO APPLE)
         ================================================================= -->
    <g font-family="Inter, system-ui, sans-serif">
        <!-- Box acqua bloccata nel terreno -->
        <g transform="translate(46, 344)" filter="url(#kShadow)">
            <rect width="194" height="72" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.4" />
            <text x="97" y="28" text-anchor="middle" fill="#0064CC" font-size="10.5" font-weight="800" letter-spacing="0.06em">CONTROSPINTA &amp; RISALITA</text>
            <text x="97" y="50" text-anchor="middle" fill="#1D1D1F" font-size="14" font-weight="800">Umidità bloccata</text>
            <text x="97" y="64" text-anchor="middle" fill="#52525B" font-size="10.5" font-weight="600">Zero efflorescenze saline</text>
        </g>

        <!-- Badge interno ambiente salubre -->
        <g transform="translate(384, 214)" filter="url(#kShadow)">
            <rect width="332" height="114" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.4" />
            <rect x="20" y="18" width="182" height="22" rx="11" fill="#DCFCE7" />
            <text x="111" y="33" text-anchor="middle" fill="#166534" font-size="10" font-weight="800" letter-spacing="0.06em">✓ LOCALE INTERNO RISANATO</text>
            <text x="20" y="68" fill="#15803D" font-size="21" font-weight="800">Zero Umidità &amp; Muffe</text>
            <text x="20" y="92" fill="#166534" font-size="13" font-weight="600">Sguscia continua 90° parete-pavimento</text>
        </g>

        <!-- Header Card Principale -->
        <g transform="translate(28, 22)" filter="url(#kShadow)">
            <rect width="548" height="104" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.3" />
            <rect x="18" y="16" width="234" height="22" rx="11" fill="#E8F2FC" />
            <text x="135" y="31" text-anchor="middle" fill="#0064CC" font-size="10.5" font-weight="800" letter-spacing="0.08em">04 · CANTINE, BOX E LOCALI INTERRATI</text>
            <text x="18" y="65" fill="#1D1D1F" font-size="20" font-weight="800">Risanamento e Barriera Controspinta</text>
            <text x="18" y="88" fill="#52525B" font-size="13" font-weight="600">Protegge murature, corselli box e pavimentazioni dall'acqua in spinta negativa</text>
        </g>

        <!-- Badge Fruibilità -->
        <g transform="translate(594, 22)" filter="url(#kShadow)">
            <rect width="178" height="104" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.3" />
            <text x="89" y="40" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="800" letter-spacing="0.06em">FRUIBILITÀ</text>
            <text x="89" y="72" text-anchor="middle" fill="#15803D" font-size="20" font-weight="800">In giornata</text>
            <text x="89" y="92" text-anchor="middle" fill="#166534" font-size="11" font-weight="700">✓ Aria salubre</text>
        </g>
    </g>
</svg>
