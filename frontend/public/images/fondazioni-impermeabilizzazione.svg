<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
    <defs>
        <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" />
        </pattern>
    </defs>

    <!-- Sfondo solido ad alto contrasto -->
    <rect width="800" height="450" fill="#0f172a" />
    <rect width="800" height="450" fill="url(#grid)" />

    <!-- Terreno / Ground cut -->
    <path d="M 0 210 L 470 210 L 470 450 L 0 450 Z" fill="#1e293b" />
    <line x1="0" y1="210" x2="470" y2="210" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 5" />
    <text x="36" y="196" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Livello terreno esterno</text>

    <!-- Fondazione: Muro controterra in calcestruzzo armato -->
    <rect x="476" y="140" width="136" height="230" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <text x="544" y="255" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Muro</text>
    <text x="544" y="276" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Controterra</text>

    <!-- Platea di fondazione -->
    <rect x="414" y="370" width="330" height="58" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <text x="579" y="405" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Platea di fondazione</text>

    <!-- Membrana continua in Poliurea (solida, zero glow) -->
    <path d="M 468 135 L 468 370 L 408 370 L 408 428" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 468 135 L 468 370 L 408 370 L 408 428" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Frecce di pressione idrostatica bloccate -->
    <g stroke="#38bdf8" stroke-width="3" fill="#38bdf8">
        <line x1="290" y1="250" x2="446" y2="250" />
        <polygon points="456,250 442,242 442,258" />
        <line x1="290" y1="305" x2="446" y2="305" />
        <polygon points="456,305 442,297 442,313" />
        <line x1="290" y1="360" x2="386" y2="360" />
        <polygon points="396,360 382,352 382,368" />
    </g>

    <rect x="36" y="276" width="234" height="62" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="153" y="302" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">SPINTA IDROSTATICA</text>
    <text x="153" y="324" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Bloccata all'esterno</text>

    <!-- Callout Card Tecnica -->
    <g transform="translate(28, 22)">
        <rect width="380" height="96" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <rect x="16" y="16" width="10" height="10" rx="2" fill="#38bdf8" />
        <text x="34" y="26" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">FONDAZIONI E PLATEE</text>
        <text x="16" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Barriera Monolitica Continua</text>
        <text x="16" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Poliurea pura applicata a spruzzo 2,5 mm</text>
    </g>

    <!-- Badge Specifiche Tecniche -->
    <g transform="translate(428, 22)">
        <rect width="344" height="96" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
        <text x="16" y="26" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">TENUTA IDRAULICA TOTALE</text>
        <text x="16" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800">Zero infiltrazioni controterra</text>
        <text x="16" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Elasticità &gt; 400% anti-fessurazione</text>
    </g>
</svg>
