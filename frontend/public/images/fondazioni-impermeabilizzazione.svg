<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
    <defs>
        <pattern id="fGrid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.7" opacity="0.65" />
        </pattern>
        <pattern id="fSoil" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
            <rect width="14" height="14" fill="#ECEAE2" />
            <line x1="0" y1="0" x2="0" y2="14" stroke="#DCD8CC" stroke-width="2" />
        </pattern>
        <pattern id="fConcrete" width="16" height="16" patternUnits="userSpaceOnUse">
            <rect width="16" height="16" fill="#E2E8F0" />
            <circle cx="4" cy="4" r="1" fill="#94A3B8" />
            <circle cx="12" cy="11" r="1" fill="#94A3B8" />
            <circle cx="11" cy="3" r="0.7" fill="#CBD5E1" />
        </pattern>
        <radialGradient id="fBgGlow" cx="62%" cy="46%" r="52%">
            <stop offset="0%" stop-color="#0071E3" stop-opacity="0.055" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>
        <filter id="fShadow" x="-14%" y="-14%" width="128%" height="134%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10" />
        </filter>
    </defs>

    <!-- Sfondo bianco puro + griglia tecnica -->
    <rect width="800" height="500" fill="#FFFFFF" />
    <rect width="800" height="500" fill="url(#fBgGlow)" />
    <rect width="800" height="500" fill="url(#fGrid)" />

    <!-- =================================================================
         SEZIONE ARCHITETTONICA: FONDAZIONI, PLATEE E MURI CONTROTERRA
         ================================================================= -->
    <g>
        <!-- Terreno esterno a sinistra -->
        <rect x="28" y="218" width="414" height="254" rx="10" fill="url(#fSoil)" />
        <!-- Striscia superficie erbosa / piano campagna -->
        <rect x="28" y="210" width="414" height="10" rx="4" fill="#BBF7D0" />
        <line x1="28" y1="218" x2="442" y2="218" stroke="#334155" stroke-width="2" stroke-linecap="round" />
        <text x="44" y="198" fill="#475569" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700">Livello terreno esterno</text>

        <!-- Locale interno asciutto a destra -->
        <rect x="536" y="160" width="236" height="236" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />

        <!-- Muro controterra in calcestruzzo armato -->
        <rect x="448" y="156" width="94" height="240" fill="url(#fConcrete)" stroke="#64748B" stroke-width="1.8" />
        <!-- Ferri armatura verticali stilizzati -->
        <g stroke="#64748B" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.55">
            <line x1="466" y1="168" x2="466" y2="394" />
            <line x1="524" y1="168" x2="524" y2="394" />
        </g>
        <text x="495" y="272" text-anchor="middle" fill="#1D1D1F" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">Muro</text>
        <text x="495" y="290" text-anchor="middle" fill="#1D1D1F" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">Controterra</text>
        <text x="495" y="308" text-anchor="middle" fill="#52525B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">(c.a.)</text>

        <!-- Platea di fondazione in calcestruzzo -->
        <rect x="386" y="396" width="386" height="62" rx="3" fill="#CBD5E1" stroke="#64748B" stroke-width="1.8" />
        <text x="579" y="432" text-anchor="middle" fill="#1D1D1F" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="0.03em">PLATEA DI FONDAZIONE IN CALCESTRUZZO</text>

        <!-- Tubo drenante al piede (drenaggio acque deviate) -->
        <circle cx="350" cy="436" r="18" fill="#EFF6FF" stroke="#0071E3" stroke-width="2.2" />
        <circle cx="350" cy="436" r="10" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="3 2" />

        <!-- =================================================================
             STRATIGRAFIA IMPERMEABILE: PRIMER + BARRIERA MONOLITICA 2,5 mm
             ================================================================= -->
        <!-- Primer epossidico strutturale -->
        <path d="M 443 160 L 443 394 L 382 394 L 382 458" fill="none" stroke="#7DD3FC" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Membrana monolitica Poliurea Pura 2,5 mm -->
        <path d="M 443 160 L 443 394 L 382 394 L 382 458" fill="none" stroke="#0071E3" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Frecce di spinta idrostatica DEVIATE verso il drenaggio senza entrare nel muro -->
        <g stroke="#0071E3" stroke-width="2.4" fill="none" stroke-linecap="round">
            <path d="M 278 262 L 414 262 Q 428 262 428 276 L 428 292" />
            <path d="M 278 314 L 414 314 Q 428 314 428 328 L 428 344" />
            <path d="M 278 366 L 360 366 Q 370 366 370 378 L 370 404" />
            <polygon points="364,400 370,412 376,400" fill="#0071E3" stroke="none" />
        </g>
    </g>

    <!-- =================================================================
         CALLOUT & BADGE TECNICI (STILE BIANCO APPLE)
         ================================================================= -->
    <g font-family="Inter, system-ui, sans-serif">
        <!-- Box Spinta idrostatica bloccata -->
        <g transform="translate(44, 274)" filter="url(#fShadow)">
            <rect width="216" height="78" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.4" />
            <text x="108" y="30" text-anchor="middle" fill="#0064CC" font-size="11" font-weight="800" letter-spacing="0.06em">SPINTA IDROSTATICA</text>
            <text x="108" y="52" text-anchor="middle" fill="#1D1D1F" font-size="14" font-weight="800">Bloccata all'esterno</text>
            <text x="108" y="68" text-anchor="middle" fill="#52525B" font-size="11" font-weight="600">Nessun sottoscorrimento</text>
        </g>

        <!-- Etichetta Giunto di ripresa sigillato -->
        <line x1="256" y1="436" x2="328" y2="436" stroke="#0071E3" stroke-width="1.4" stroke-dasharray="3 2" />
        <g filter="url(#fShadow)">
            <rect x="86" y="418" width="172" height="36" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
            <text x="172" y="440" text-anchor="middle" fill="#1D1D1F" font-size="11.5" font-weight="700">Drenaggio al piede</text>
        </g>

        <!-- Badge interno protetto (destra) -->
        <g transform="translate(562, 232)" filter="url(#fShadow)">
            <rect width="192" height="106" rx="16" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.4" />
            <text x="96" y="34" text-anchor="middle" fill="#166534" font-size="10.5" font-weight="800" letter-spacing="0.06em">STRUTTURA PROTETTA</text>
            <text x="96" y="64" text-anchor="middle" fill="#15803D" font-size="20" font-weight="800">✓ Asciutto</text>
            <text x="96" y="88" text-anchor="middle" fill="#166534" font-size="11.5" font-weight="600">Giunti e ferri al sicuro</text>
        </g>

        <!-- Header Card Principale -->
        <g transform="translate(28, 22)" filter="url(#fShadow)">
            <rect width="424" height="104" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.3" />
            <rect x="18" y="16" width="180" height="22" rx="11" fill="#E8F2FC" />
            <text x="108" y="31" text-anchor="middle" fill="#0064CC" font-size="10.5" font-weight="800" letter-spacing="0.08em">03 · FONDAZIONI E PLATEE</text>
            <text x="18" y="65" fill="#1D1D1F" font-size="20" font-weight="800">Barriera Monolitica Continua</text>
            <text x="18" y="88" fill="#52525B" font-size="13" font-weight="600">Poliurea pura a spruzzo 2,5 mm · Adesione chimica</text>
        </g>

        <!-- Badge Elasticità -->
        <g transform="translate(470, 22)" filter="url(#fShadow)">
            <rect width="302" height="104" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.3" />
            <text x="20" y="34" fill="#0064CC" font-size="10.5" font-weight="800" letter-spacing="0.08em">CRACK-BRIDGING DINAMICO</text>
            <text x="20" y="66" fill="#1D1D1F" font-size="20" font-weight="800">Elasticità &gt; 400%</text>
            <text x="20" y="88" fill="#52525B" font-size="12.5" font-weight="600">Assorbe assestamenti e microlesioni</text>
        </g>
    </g>
</svg>
