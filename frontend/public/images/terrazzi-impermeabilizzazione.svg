<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
    <defs>
        <linearGradient id="terrazzoBg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#18181b" />
            <stop offset="100%" stop-color="#09090b" />
        </linearGradient>
        <linearGradient id="terrazzoConcrete" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#27272a" />
            <stop offset="100%" stop-color="#3f3f46" />
        </linearGradient>
        <linearGradient id="terrazzoPoly" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>
        <pattern id="terrazzoGrid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#27272a" stroke-width="0.8" stroke-opacity="0.4" />
        </pattern>
        <filter id="terrazzoGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="7" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="800" height="450" fill="url(#terrazzoBg)" />
    <rect width="800" height="450" fill="url(#terrazzoGrid)" />

    <!-- Struttura Terrazzo / Sezione Balcone -->
    <!-- Muro portante dell'edificio a sinistra -->
    <rect x="80" y="80" width="140" height="310" fill="url(#terrazzoConcrete)" stroke="#52525b" stroke-width="1.5" />
    <rect x="140" y="110" width="80" height="150" fill="#18181b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="150" y="190" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Soglia Porta</text>

    <!-- Soletta a sbalzo / Massetto pendenza terrazzo -->
    <path d="M 220 280 L 680 305 L 680 390 L 220 390 Z" fill="url(#terrazzoConcrete)" stroke="#52525b" stroke-width="1.5" />
    <!-- Parapetto perimetrale terrazzo a destra -->
    <rect x="640" y="180" width="40" height="130" fill="url(#terrazzoConcrete)" stroke="#52525b" stroke-width="1.5" />

    <!-- Bocchettone di scarico / pluviale -->
    <rect x="610" y="300" width="24" height="90" fill="#09090b" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="622" y1="310" x2="622" y2="390" stroke="#0284c7" stroke-width="3" stroke-dasharray="6 4" />

    <!-- Membrana continua in Poliurea pura + Risvolto verticale (Blu Elettrico) -->
    <!-- Risvolto su muro a sinistra, stesura continua su piano inclinato, risvolto su parapetto a destra -->
    <path d="M 214 200 L 214 276 L 610 301 L 610 320 M 634 302 L 646 303 L 646 220" fill="none" stroke="url(#terrazzoPoly)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#terrazzoGlow)" />
    <path d="M 214 200 L 214 276 L 610 301 L 610 320 M 634 302 L 646 303 L 646 220" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Linea di deflusso acqua piovana verso lo scarico -->
    <g stroke="#38bdf8" stroke-width="1.8" opacity="0.75">
        <path d="M 300 260 L 360 265" stroke-dasharray="4 3" />
        <path d="M 420 268 L 480 273" stroke-dasharray="4 3" />
        <path d="M 530 278 L 590 283" stroke-dasharray="4 3" />
    </g>

    <!-- Pioggia simulata con gocce d'acqua -->
    <g stroke="#0284c7" stroke-width="1.5" opacity="0.6">
        <line x1="320" y1="120" x2="310" y2="150" />
        <line x1="390" y1="140" x2="380" y2="170" />
        <line x1="470" y1="110" x2="460" y2="140" />
        <line x1="550" y1="130" x2="540" y2="160" />
    </g>

    <!-- Header Box Scheda Tecnica -->
    <g transform="translate(40, 30)">
        <rect width="320" height="85" rx="12" fill="#09090b" fill-opacity="0.95" stroke="#3f3f46" stroke-width="1" />
        <rect x="14" y="14" width="8" height="8" rx="2" fill="#38bdf8" />
        <text x="30" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1">TERRAZZI E BALCONI</text>
        <text x="14" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Impermeabilizzazione Continua</text>
        <text x="14" y="68" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="12">Anche senza demolizione delle piastrelle esistenti</text>
    </g>

    <!-- Badge Prestazioni UV e Calpestabilità -->
    <g transform="translate(540, 40)">
        <rect width="220" height="74" rx="10" fill="#09090b" fill-opacity="0.9" stroke="#27272a" stroke-width="1" />
        <text x="16" y="26" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">TOPCOAT ALIFATICO UV</text>
        <text x="16" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Calpestabile in 60 minuti</text>
        <text x="16" y="64" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Raccordi ermetici su soglie e scarichi</text>
    </g>
</svg>