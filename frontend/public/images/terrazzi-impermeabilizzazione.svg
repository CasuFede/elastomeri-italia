<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
    <defs>
        <pattern id="terrazzoGrid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" />
        </pattern>
    </defs>

    <!-- Sfondo solido ad alto contrasto -->
    <rect width="800" height="450" fill="#0f172a" />
    <rect width="800" height="450" fill="url(#terrazzoGrid)" />

    <!-- Struttura Terrazzo / Sezione Balcone -->
    <!-- Muro portante dell'edificio a sinistra -->
    <rect x="60" y="135" width="150" height="275" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <rect x="120" y="155" width="90" height="125" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 3" />
    <text x="165" y="212" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Soglia</text>
    <text x="165" y="232" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Porta</text>

    <!-- Soletta a sbalzo / Massetto pendenza terrazzo -->
    <path d="M 210 295 L 690 320 L 690 410 L 210 410 Z" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <text x="415" y="372" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Massetto / Pavimentazione esistente</text>

    <!-- Parapetto perimetrale terrazzo a destra -->
    <rect x="650" y="195" width="40" height="125" fill="#334155" stroke="#94a3b8" stroke-width="2" />

    <!-- Bocchettone di scarico / pluviale -->
    <rect x="605" y="315" width="30" height="95" fill="#0b0f17" stroke="#38bdf8" stroke-width="2" />
    <line x1="620" y1="322" x2="620" y2="404" stroke="#38bdf8" stroke-width="4" stroke-dasharray="7 5" />

    <!-- Membrana continua in Poliurea pura (solida, nitida, senza glow) -->
    <path d="M 204 205 L 204 291 L 605 312 L 605 335 M 635 314 L 644 314 L 644 225" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 204 205 L 204 291 L 605 312 L 605 335 M 635 314 L 644 314 L 644 225" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Deflusso acqua piovana -->
    <g stroke="#38bdf8" stroke-width="2.5">
        <path d="M 285 270 L 355 274" stroke-dasharray="6 4" />
        <path d="M 395 277 L 465 281" stroke-dasharray="6 4" />
        <path d="M 505 284 L 580 289" stroke-dasharray="6 4" />
        <polygon points="592,290 578,283 578,296" fill="#38bdf8" />
    </g>

    <!-- Pioggia -->
    <g stroke="#38bdf8" stroke-width="2">
        <line x1="310" y1="155" x2="298" y2="188" />
        <line x1="395" y1="168" x2="383" y2="201" />
        <line x1="480" y1="155" x2="468" y2="188" />
        <line x1="560" y1="168" x2="548" y2="201" />
    </g>

    <!-- Etichetta membrana -->
    <rect x="295" y="216" width="235" height="34" rx="6" fill="#0284c7" />
    <text x="412" y="238" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">POLIUREA CONTINUA 2-3 mm</text>

    <!-- Header Box Scheda Tecnica -->
    <g transform="translate(28, 22)">
        <rect width="415" height="96" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <rect x="16" y="16" width="10" height="10" rx="2" fill="#38bdf8" />
        <text x="34" y="26" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">TERRAZZI E BALCONI</text>
        <text x="16" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Impermeabilizzazione Continua</text>
        <text x="16" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Applicabile senza demolire le piastrelle esistenti</text>
    </g>

    <!-- Badge Prestazioni UV e Calpestabilità -->
    <g transform="translate(462, 22)">
        <rect width="310" height="96" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
        <text x="16" y="26" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">FINITURA UV ANTISCIVOLO</text>
        <text x="16" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800">Calpestabile in 60 minuti</text>
        <text x="16" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Raccordi ermetici su soglie e scarichi</text>
    </g>
</svg>
