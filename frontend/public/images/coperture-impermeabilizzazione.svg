<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
    <defs>
        <pattern id="copertureGrid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" />
        </pattern>
    </defs>

    <!-- Sfondo solido ad alto contrasto -->
    <rect width="800" height="450" fill="#0f172a" />
    <rect width="800" height="450" fill="url(#copertureGrid)" />

    <!-- Muro maestro sinistro -->
    <rect x="68" y="265" width="102" height="155" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <!-- Muro maestro destro -->
    <rect x="630" y="265" width="102" height="155" fill="#334155" stroke="#94a3b8" stroke-width="2" />

    <!-- Solaio sottotetto -->
    <rect x="170" y="365" width="460" height="45" fill="#334155" stroke="#94a3b8" stroke-width="2" />
    <text x="400" y="393" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Locale Sottotetto / Struttura Protetta</text>

    <!-- Falda tetto -->
    <path d="M 38 272 L 400 155 L 762 272 L 732 302 L 400 194 L 68 302 Z" fill="#334155" stroke="#94a3b8" stroke-width="2" />

    <!-- Camino / Corpo emergente -->
    <rect x="490" y="128" width="66" height="82" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
    <path d="M 480 120 L 566 120 L 556 128 L 490 128 Z" fill="#475569" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="523" y="172" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Camino</text>

    <!-- Grondaie perimetrali -->
    <path d="M 26 278 Q 26 308 54 308 L 62 308" fill="none" stroke="#38bdf8" stroke-width="3" />
    <line x1="40" y1="308" x2="40" y2="415" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" />
    <path d="M 774 278 Q 774 308 746 308 L 738 308" fill="none" stroke="#38bdf8" stroke-width="3" />
    <line x1="760" y1="308" x2="760" y2="415" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" />

    <!-- Membrana continua in Poliurea Pura (solida, zero glow) -->
    <path d="M 34 282 L 48 270 L 400 150 L 490 179 L 490 144 L 492 144 L 492 180 L 556 201 L 556 164 L 558 164 L 558 202 L 752 270 L 766 282" fill="none" stroke="#0284c7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 34 282 L 48 270 L 400 150 L 490 179 L 490 144 L 492 144 L 492 180 L 556 201 L 556 164 L 558 164 L 558 202 L 752 270 L 766 282" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Etichetta membrana -->
    <rect x="278" y="248" width="244" height="34" rx="6" fill="#0284c7" />
    <text x="400" y="270" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">MANTO CONTINUO ZERO GIUNTI</text>

    <!-- Header Box Scheda Tecnica -->
    <g transform="translate(28, 22)">
        <rect width="410" height="96" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
        <rect x="16" y="16" width="10" height="10" rx="2" fill="#38bdf8" />
        <text x="34" y="26" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="1">COPERTURE E TETTI INDUSTRIALI</text>
        <text x="16" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">Scudo Monolitico Senza Giunti</text>
        <text x="16" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Resiste a ristagni, grandine e sbalzi termici</text>
    </g>

    <!-- Badge Prestazioni e Durabilità -->
    <g transform="translate(458, 22)">
        <rect width="314" height="96" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
        <text x="16" y="26" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">TENUTA CERTIFICATA</text>
        <text x="16" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800">Durata attesa oltre 25 anni</text>
        <text x="16" y="80" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Sigilla camini, gronde e lucernari</text>
    </g>
</svg>
