<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
    <defs>
        <pattern id="cGrid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.7" opacity="0.65" />
        </pattern>
        <pattern id="cWall" width="18" height="12" patternUnits="userSpaceOnUse">
            <rect width="18" height="12" fill="#F1F5F9" />
            <path d="M 0 6 H 18 M 9 0 V 6 M 0 6 V 12" stroke="#CBD5E1" stroke-width="0.8" />
        </pattern>
        <radialGradient id="cBgGlow" cx="50%" cy="46%" r="54%">
            <stop offset="0%" stop-color="#0071E3" stop-opacity="0.055" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>
        <clipPath id="cLoupeClip">
            <circle cx="674" cy="118" r="54" />
        </clipPath>
        <filter id="cShadow" x="-14%" y="-14%" width="128%" height="134%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10" />
        </filter>
    </defs>

    <!-- Sfondo bianco puro + griglia tecnica -->
    <rect width="800" height="500" fill="#FFFFFF" />
    <rect width="800" height="500" fill="url(#cBgGlow)" />
    <rect width="800" height="500" fill="url(#cGrid)" />

    <!-- =================================================================
         SEZIONE ARCHITETTONICA: COPERTURE, TETTI E SHED INDUSTRIALI
         ================================================================= -->
    <g>
        <!-- Interno locale sottotetto / capannone protetto -->
        <polygon points="108,308 400,192 692,308 692,410 108,410" fill="#F8FAFC" />

        <!-- Muri perimetrali -->
        <rect x="64" y="302" width="44" height="158" fill="url(#cWall)" stroke="#64748B" stroke-width="1.8" />
        <rect x="692" y="302" width="44" height="158" fill="url(#cWall)" stroke="#64748B" stroke-width="1.8" />

        <!-- Capriata / travatura interna pulita -->
        <g stroke="#CBD5E1" stroke-width="2" fill="none">
            <line x1="108" y1="316" x2="692" y2="316" />
            <line x1="400" y1="196" x2="400" y2="316" />
            <line x1="254" y1="254" x2="254" y2="316" />
            <line x1="546" y1="254" x2="546" y2="316" />
            <line x1="254" y1="316" x2="400" y2="246" />
            <line x1="546" y1="316" x2="400" y2="246" />
        </g>

        <!-- Solaio sottotetto / piano operativo -->
        <rect x="108" y="406" width="584" height="54" fill="#CBD5E1" stroke="#64748B" stroke-width="1.8" />
        <text x="400" y="438" text-anchor="middle" fill="#334155" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.04em">LOCALE SOTTOTETTO / AREA OPERATIVA 100% ASCIUTTA</text>

        <!-- Struttura falde del tetto -->
        <path d="M 46 308 L 400 166 L 754 308 L 736 330 L 400 196 L 64 330 Z" fill="#94A3B8" stroke="#475569" stroke-width="1.8" />

        <!-- Lucernario / Cupolino su falda sinistra -->
        <polygon points="186,250 214,218 286,192 294,207" fill="#DBEAFE" stroke="#475569" stroke-width="1.8" />
        <line x1="238" y1="210" x2="246" y2="226" stroke="#60A5FA" stroke-width="1.4" />

        <!-- Comignolo / Torrino su falda destra -->
        <rect x="498" y="150" width="52" height="78" fill="url(#cWall)" stroke="#475569" stroke-width="1.8" />
        <rect x="490" y="142" width="68" height="10" rx="2.5" fill="#475569" />

        <!-- Staffaggio impianto fotovoltaico sigillato -->
        <g>
            <rect x="610" y="218" width="12" height="28" fill="#475569" />
            <line x1="582" y1="208" x2="656" y2="236" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
            <line x1="582" y1="208" x2="656" y2="236" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" />
        </g>

        <!-- Grondaie perimetrali & pluviali -->
        <path d="M 32 310 Q 32 336 54 336 L 62 336" fill="none" stroke="#0071E3" stroke-width="3" stroke-linecap="round" />
        <line x1="45" y1="336" x2="45" y2="452" stroke="#0071E3" stroke-width="2.6" stroke-dasharray="7 5" />
        <polygon points="39,446 45,458 51,446" fill="#0071E3" />

        <path d="M 768 310 Q 768 336 746 336 L 738 336" fill="none" stroke="#0071E3" stroke-width="3" stroke-linecap="round" />
        <line x1="755" y1="336" x2="755" y2="452" stroke="#0071E3" stroke-width="2.6" stroke-dasharray="7 5" />
        <polygon points="749,446 755,458 761,446" fill="#0071E3" />

        <!-- =================================================================
             STRATIGRAFIA: PRIMER + MEMBRANA CONTINUA MONOLITICA (#0071E3)
             ================================================================= -->
        <!-- Primer epossidico -->
        <path d="M 42 310 L 188 250 L 210 226 M 292 208 L 400 163 L 498 202 L 498 166 M 550 176 L 550 223 L 758 310" fill="none" stroke="#7DD3FC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Membrana Poliurea continua senza giunti -->
        <path d="M 42 310 L 188 250 L 210 226 M 292 208 L 400 163 L 498 202 L 498 166 M 550 176 L 550 223 L 758 310" fill="none" stroke="#0071E3" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Sigillatura staffa FV -->
        <path d="M 604 246 L 610 232 L 622 232 L 628 256" fill="none" stroke="#0071E3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Pioggia respinta / deviata in gronda -->
        <g stroke="#0071E3" stroke-width="1.8" stroke-linecap="round" opacity="0.65">
            <line x1="330" y1="138" x2="322" y2="156" />
            <line x1="400" y1="126" x2="394" y2="144" />
            <line x1="454" y1="138" x2="448" y2="156" />
        </g>
    </g>

    <!-- =================================================================
         CALLOUT & LENTE STRATIGRAFIA
         ================================================================= -->
    <g font-family="Inter, system-ui, sans-serif">
        <!-- Pill centrale -->
        <g filter="url(#cShadow)">
            <rect x="270" y="344" width="260" height="34" rx="17" fill="#0071E3" />
            <text x="400" y="366" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800" letter-spacing="0.03em">MANTO CONTINUO ZERO GIUNTI</text>
        </g>

        <!-- Etichetta Lucernario -->
        <line x1="176" y1="176" x2="226" y2="212" stroke="#0071E3" stroke-width="1.4" stroke-dasharray="3 2" />
        <g filter="url(#cShadow)">
            <rect x="62" y="152" width="132" height="36" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
            <text x="128" y="174" text-anchor="middle" fill="#1D1D1F" font-size="11.5" font-weight="700">Lucernario sigillato</text>
        </g>

        <!-- Etichetta Camino -->
        <g filter="url(#cShadow)">
            <rect x="468" y="248" width="112" height="32" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.2" />
            <text x="524" y="268" text-anchor="middle" fill="#1D1D1F" font-size="11.5" font-weight="700">Raccordo camino</text>
        </g>

        <!-- Lente stratigrafia (in alto a destra) -->
        <line x1="636" y1="156" x2="616" y2="226" stroke="#0071E3" stroke-width="1.5" stroke-dasharray="4 3" />
        <g filter="url(#cShadow)">
            <circle cx="674" cy="118" r="58" fill="#FFFFFF" stroke="#161D2E" stroke-width="2.8" />
            <g clip-path="url(#cLoupeClip)">
                <rect x="616" y="60" width="116" height="30" fill="#F8FAFC" />
                <rect x="616" y="90" width="116" height="22" fill="#0071E3" />
                <rect x="616" y="112" width="116" height="10" fill="#7DD3FC" />
                <rect x="616" y="122" width="116" height="54" fill="#64748B" />
                <text x="674" y="105" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="800">Poliurea 2 mm</text>
                <text x="674" y="146" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700">Guaina / Lamiera</text>
            </g>
            <circle cx="674" cy="118" r="54" fill="none" stroke="#0071E3" stroke-width="1.4" opacity="0.35" />
        </g>
        <text x="674" y="191" text-anchor="middle" fill="#1D1D1F" font-size="10" font-weight="800">ZERO FIAMME LIBERE</text>

        <!-- Header Card Principale -->
        <g transform="translate(28, 22)" filter="url(#cShadow)">
            <rect width="388" height="104" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.3" />
            <rect x="18" y="16" width="210" height="22" rx="11" fill="#E8F2FC" />
            <text x="123" y="31" text-anchor="middle" fill="#0064CC" font-size="10.5" font-weight="800" letter-spacing="0.08em">02 · COPERTURE E TETTI INDUSTRIALI</text>
            <text x="18" y="65" fill="#1D1D1F" font-size="20" font-weight="800">Scudo Monolitico Continuo</text>
            <text x="18" y="88" fill="#52525B" font-size="13" font-weight="600">Sigilla lucernari, camini, gronde e fotovoltaico</text>
        </g>

        <!-- Badge Durabilità -->
        <g transform="translate(432, 22)" filter="url(#cShadow)">
            <rect width="160" height="104" rx="16" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.3" />
            <text x="80" y="40" text-anchor="middle" fill="#166534" font-size="10" font-weight="800" letter-spacing="0.06em">ETAG 005 · W3</text>
            <text x="80" y="72" text-anchor="middle" fill="#15803D" font-size="23" font-weight="800">25+ anni</text>
            <text x="80" y="92" text-anchor="middle" fill="#166534" font-size="11" font-weight="700">✓ Grandine &amp; UV</text>
        </g>
    </g>
</svg>
