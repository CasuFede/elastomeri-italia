server {
    listen 80;

    # Inoltra le chiamate API al container backend
    # Reverse Proxy per il backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000/; # <-- DEVE ESSERE 'backend' e deve avere lo slash finale!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inoltra tutto il resto al container frontend (Astro in dev mode)
    location / {
        proxy_pass http://frontend:4321;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Supporto per i WebSocket di Astro (necessario per l'hot-reload)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
