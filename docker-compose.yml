services:
  frontend:
    build: ./frontend
    user: node
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules_v4:/app/node_modules
    command: npm run dev
    # Esposta internamente a Nginx, non serve esporre la porta 4321 all'host

  backend:
    build: ./backend
    user: node
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    # Esposta internamente a Nginx da Pywrangler sulla porta 8000

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  frontend_node_modules_v4:
  backend_venv:
