[project]
name = "elastomeri-italia-api"
version = "0.1.0"
description = "FastAPI backend deployed as a Cloudflare Python Worker"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.0",
    "pydantic[email]>=2.11.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
